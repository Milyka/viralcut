<!doctype html>
<html lang="ru" data-theme="obsidian">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KrlzCut — локальная студия монтажа коротких клипов</title>
  <meta name="description" content="Локальная студия нарезки коротких клипов на FFmpeg и Whisper: умное кадрирование, Слой игры и анимированные субтитры." />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/design-system.css" />
  <link rel="stylesheet" id="customFontsCss" href="/api/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111113' stroke='%233f3f46' stroke-width='1.5'/%3E%3Cpath d='M10 8v16M10 16l9-8M14 13l8 11' stroke='%23fafafa' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="app">
    <aside class="sidebar" aria-label="Навигация студии">
      <div class="brand-row">
        <button class="brand" id="brandHome" type="button" title="Открыть обзор студии">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 5v14M7 12l8-7M11 9.5l6.5 9.5"/>
            </svg>
          </span>
          <span class="brand-text">
            <b>KrlzCut</b>
            <small id="appVersion">2.0.0</small>
          </span>
        </button>
      </div>

      <nav class="side-nav" id="sideNav" aria-label="Разделы">
        <button class="nav-item active" data-nav="dashboard" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Обзор</span>
        </button>
        <button class="nav-item" data-nav="new" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Новый проект</span>
        </button>
        <button class="nav-item" data-nav="projects" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Проекты</span>
          <b class="nav-badge" id="navProjectsCount" hidden>0</b>
        </button>
        <button class="nav-item" data-nav="queue" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          <span>Очередь</span>
          <b class="nav-badge live" id="navQueueCount" hidden>0</b>
        </button>
        <button class="nav-item" data-nav="settings" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Настройки</span>
        </button>
      </nav>

      <div class="side-section-head">
        <span class="side-label">Недавние</span>
        <button class="side-all-btn" id="sideAllProjects" type="button">Все</button>
      </div>
      <div class="project-list" id="projectList"></div>

      <a class="update-card" id="updateCard" hidden target="_blank" rel="noopener">
        <span class="update-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </span>
        <span class="update-text">
          <b id="updateTitle">Доступно обновление</b>
          <small id="updateSub">Открыть на GitHub</small>
        </span>
        <button class="update-hide" id="updateHide" type="button" title="Скрыть уведомление" aria-label="Скрыть уведомление">×</button>
      </a>

      <div class="side-foot">
        <button class="assistant-pill" id="helpBtn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Справка и ИИ</span>
        </button>

        <div class="gpu-card" id="gpuCard" role="status" aria-label="Состояние оборудования">
          <div class="gpu-card-top">
            <span class="gpu-dot" id="gpuDot" aria-hidden="true"></span>
            <b class="gpu-name" id="gpuName">Проверка движка…</b>
            <span class="gpu-chip" id="gpuChip">CPU</span>
          </div>
          <div class="gpu-card-meta">
            <span id="gpuMeta">Whisper Small</span>
            <span id="gpuLoad">0%</span>
          </div>
          <div class="gpu-mini-bar"><i id="gpuMiniBar" style="width:0%"></i></div>
        </div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="modal hidden" id="modal"></div>
  <div id="toasts" role="region" aria-label="Уведомления" aria-live="polite"></div>
  <input type="file" id="fileInput" accept="video/*,audio/*,.mp4,.mov,.mkv,.webm,.m4v,.avi,.ts,.mts,.m2ts,.mp3,.m4a,.wav,.aac,.ogg,.flac" class="hidden" />
  <input type="file" id="fontInput" accept=".ttf,.otf,font/ttf,font/otf" class="hidden" />
  <input type="file" id="gameInput" accept="video/*,.mp4,.mov,.mkv,.webm,.m4v" class="hidden" />

  <script src="/static/app.js"></script>
  <script src="/static/studio2.js"></script>
  <script src="/static/editor2.js"></script>
</body>
</html>
